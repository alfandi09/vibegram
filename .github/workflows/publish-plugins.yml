name: Publish Plugins

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    validate:
        name: Validate plugins
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js 24.x
              uses: actions/setup-node@v4
              with:
                  node-version: '24.x'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build core (plugins resolve vibegram from the repo root)
              run: npm run build

            - name: Typecheck, test, and build plugins
              run: npm run plugins:validate

            - name: Pack dry-run each plugin
              run: |
                  for dir in plugins/*/; do
                    name=$(basename "$dir")
                    case "$name" in _*) continue ;; esac
                    echo "::group::$name"
                    (cd "$dir" && npm pack --dry-run)
                    echo "::endgroup::"
                  done
                  (cd packages/create-vibegram && npm pack --dry-run)

    publish:
        name: Publish changed plugins to npm
        runs-on: ubuntu-latest
        needs: [validate]
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        # id-token lets npm attach a signed provenance statement (and use trusted publishing).
        permissions:
            contents: read
            id-token: write

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js 24.x
              uses: actions/setup-node@v4
              with:
                  node-version: '24.x'
                  registry-url: 'https://registry.npmjs.org'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build core
              run: npm run build

            - name: Validate plugins
              run: npm run plugins:validate

            - name: Publish plugins whose version changed
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  for dir in plugins/*/ packages/create-vibegram/; do
                    name=$(basename "$dir")
                    case "$name" in _*) continue ;; esac
                    PKG_NAME=$(node -p "require('./${dir}package.json').name")
                    LOCAL_VERSION=$(node -p "require('./${dir}package.json').version")
                    REMOTE_VERSION=$(npm view "$PKG_NAME" version 2>/dev/null || echo "0.0.0")
                    if [ "$LOCAL_VERSION" != "$REMOTE_VERSION" ]; then
                      echo "Publishing $PKG_NAME@$LOCAL_VERSION (npm: $REMOTE_VERSION)"
                      (cd "$dir" && npm publish --access public --provenance)
                    else
                      echo "Skipping $PKG_NAME@$LOCAL_VERSION (already on npm)"
                    fi
                  done
